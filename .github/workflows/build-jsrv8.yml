name: Build jsrv8 wheels
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.target }}
          cache-on-failure: true
      - uses: docker/setup-qemu-action@v3
        if: runner.arch == 'ARM64'
        with:
          platforms: amd64
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev libglib2.0-dev
          if [ "$(uname -m)" = aarch64 ]; then
            sudo apt-get install -y libc6-amd64-cross libgcc-s1-amd64-cross libstdc++6-amd64-cross
            echo 'QEMU_LD_PREFIX=/usr/x86_64-linux-gnu' >> "$GITHUB_ENV"
          fi
          git clone --depth 1 --branch v147.0.0 --recurse-submodules --shallow-submodules https://github.com/denoland/rusty_v8.git /tmp/rusty_v8
          # 系统标准库不保证间接包含 memory，显式补齐上游头文件依赖。
          sed -i '1i#include <memory>' /tmp/rusty_v8/v8/src/bigint/bigint.h
          printf '\n[patch.crates-io]\nv8 = { path = "/tmp/rusty_v8" }\n' >> Cargo.toml
      - name: Build wheel
        shell: bash
        env:
          V8_FROM_SOURCE: ${{ runner.os == 'Linux' && '1' || '0' }}
          GN_ARGS: use_custom_libcxx=false is_component_build=false v8_monolithic=true v8_use_external_startup_data=false v8_enable_sandbox=false is_debug=false use_sysroot=false is_clang=true v8_enable_fast_tls=false
          EXTRA_GN_ARGS: v8_enable_fast_tls=false treat_warnings_as_errors=false
        run: |
          python -m pip install maturin
          maturin build --release --target ${{ matrix.target }} --out dist
      - name: Verify native runtime
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python -c "import jsrv8; c=jsrv8.Context(); assert c.eval('Promise.resolve(42)',return_value=True)==42; assert c.eval('WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0]))',return_value=True); del c"
      - uses: actions/upload-artifact@v4
        with:
          name: jsrv8-${{ matrix.target }}
          path: dist/*.whl
